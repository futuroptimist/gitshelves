name: Site artifact
on:
  pull_request:
    branches: [main]
    paths: [Dockerfile, LICENSE, '.dockerignore', 'web/**', 'openscad/**', 'scripts/validate-site.mjs', '.github/workflows/site-artifact.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: '${{ github.event.pull_request.head.sha }}'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.19.0'}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: site-export
          outputs: type=local,dest=site-artifact
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: node scripts/validate-site.mjs site-artifact
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Check browser source
        working-directory: web
        run: npm run format && npm run lint && npm run typecheck && npm test
      - name: Check the browser and complete Site artifact
        shell: bash
        run: |
          docker run --rm --init --user pwuser --shm-size=1g \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e \
            bash -euc '
              set -o pipefail
              mkdir /tmp/gitshelves
              tar -C /source --exclude=web/node_modules --exclude=web/dist -cf - web site-artifact |
                tar -C /tmp/gitshelves -xf -
              cd /tmp/gitshelves/web
              npm ci --ignore-scripts --cache /tmp/npm-cache
              npm run test:browser
              npx --no-install vite preview --host 127.0.0.1 --outDir ../site-artifact/dist &
              preview=$!
              trap "kill $preview" EXIT
              for attempt in {1..30}; do
                curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
                sleep 1
              done
              node scripts/smoke-site.mjs
            '
      - uses: actions/upload-artifact@v4
        with:
          name: gitshelves-site-${{ github.event.pull_request.head.sha }}
          path: site-artifact/
          if-no-files-found: error
