name: Web image
on:
  pull_request:
    branches: [main]
    paths: [Dockerfile, .dockerignore, "web/**", "openscad/**", "scripts/**", ".github/workflows/ci-image.yml"]
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, "web/**", "openscad/**", "scripts/**", ".github/workflows/ci-image.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Compute immutable coordinate
        id: coordinate
        shell: bash
        run: echo "tag=main-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}"}
      - name: Build and conditionally publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/futuroptimist/gitshelves:${{ steps.coordinate.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report immutable coordinate
        run: |
          echo "image=ghcr.io/futuroptimist/gitshelves:${{ steps.coordinate.outputs.tag }}"
          echo "digest=${{ steps.build.outputs.digest }}"
