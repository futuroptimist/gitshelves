name: Web image
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - web/**
      - openscad/**
      - .github/workflows/ci-image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - web/**
      - openscad/**
      - .github/workflows/ci-image.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Coordinates
        id: coordinates
        shell: bash
        run: echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/futuroptimist/gitshelves:${{ steps.coordinates.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report immutable coordinate
        run: |
          echo "Image: ghcr.io/futuroptimist/gitshelves:${{ steps.coordinates.outputs.tag }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.coordinates.outputs.tag }} — ${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
