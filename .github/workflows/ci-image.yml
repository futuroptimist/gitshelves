name: Container image
on:
  pull_request:
    branches: [main]
    paths: [Dockerfile, .dockerignore, "web/**", "openscad/**", ".github/workflows/ci-image.yml"]
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, "web/**", "openscad/**", ".github/workflows/ci-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load native image for runtime validation
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: gitshelves:runtime-smoke
          cache-from: type=gha
      - name: Smoke-test final image
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker inspect --format '{{.Config.User}}' gitshelves:runtime-smoke)" = "10001:10001"

          name="gitshelves-runtime-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$name" \
            --read-only \
            --user 10001:10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish 127.0.0.1:18080:8080 \
            gitshelves:runtime-smoke

          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18080/healthz; then
              break
            fi
            if (( attempt == 30 )); then
              docker logs "$name"
              exit 1
            fi
            sleep 1
          done

          test "$(curl --fail --silent --output /tmp/root.html --write-out '%{http_code}' http://127.0.0.1:18080/)" = 200
          grep --fixed-strings --quiet 'GitShelves' /tmp/root.html
          for endpoint in healthz livez; do
            test "$(curl --fail --silent --output "/tmp/$endpoint" --write-out '%{http_code}' "http://127.0.0.1:18080/$endpoint")" = 200
            test "$(cat "/tmp/$endpoint")" = ok
          done

  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Compute immutable tag
        id: meta
        shell: bash
        run: echo "tag=main-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}"}
      - name: Publish multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/futuroptimist/gitshelves:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report immutable coordinate
        run: |
          echo "Image: ghcr.io/futuroptimist/gitshelves:${{ steps.meta.outputs.tag }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"
          { echo '### Container result'; echo '`ghcr.io/futuroptimist/gitshelves:${{ steps.meta.outputs.tag }}`'; echo '`${{ steps.build.outputs.digest }}`'; } >> "$GITHUB_STEP_SUMMARY"
